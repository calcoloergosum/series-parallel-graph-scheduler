name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: authoritative release gate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x
          - 22.x
          - 24.x

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Generate graph schema
        run: npm run schema:graph

      - name: Build
        run: npm run build

      - name: Complexity guardrails
        run: npm run guardrails

      - name: Run tests
        run: npm test

      - name: Run core coverage
        run: npm run coverage:core

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare failure artifact directories
        run: mkdir -p ci-artifacts/browser ci-artifacts/smoke

      - name: Run visualizer browser test
        shell: bash
        env:
          SPG_BROWSER_ARTIFACT_DIR: ci-artifacts/browser
          SPG_REQUIRE_BROWSER: "1"
        run: |
          set -o pipefail
          npm run test:visualizer 2>&1 | tee ci-artifacts/browser/visualizer-browser.log

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-artifacts-node-${{ matrix.node-version }}
          path: ci-artifacts/browser/**
          if-no-files-found: ignore

      - name: Run migration smoke
        shell: bash
        run: |
          set -o pipefail
          npm run smoke:migration 2>&1 | tee ci-artifacts/smoke/migration-smoke.log

      - name: Upload smoke failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-artifacts-node-${{ matrix.node-version }}
          path: ci-artifacts/smoke/**
          if-no-files-found: ignore

      - name: Release dry run
        run: npm run release:check
